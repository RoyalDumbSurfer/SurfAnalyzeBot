{% extends "base.html" %}
{% block title %}{{ t("Your Videos") }} – SurfAnalyze{% endblock %}

{% block content %}

<div class="text-center mb-16">
    <h1 class="text-3xl sm:text-5xl font-bold mb-6 bg-gradient-to-r from-accent to-accent2 bg-clip-text text-transparent">
        {{ t("Your Videos") }}
    </h1>
    <p class="text-gray-400">
        {{ t("Your personal surf analyses") }}
    </p>
</div>

<div id="dashboard-container">
    {% include "dashboard_partial.html" %}
</div>

<script>
setInterval(() => {
    fetch("/dashboard-data")
        .then(res => {
            if (res.redirected) { window.location.href = "/login"; return ""; }
            if (!res.ok) throw new Error("History unavailable");
            return res.text();
        })
        .then(html => {
            document.getElementById("dashboard-container").innerHTML = html;
        }).catch(() => {});
}, 5000);
</script>

{% endblock %}
