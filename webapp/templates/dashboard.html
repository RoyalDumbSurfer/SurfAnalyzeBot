{% extends "base.html" %}
{% block title %}Your Sessions – SurfAnalyze{% endblock %}

{% block content %}

<div class="text-center mb-16">
    <h1 class="text-5xl font-bold mb-6 bg-gradient-to-r from-accent to-accent2 bg-clip-text text-transparent">
        Your Sessions
    </h1>
    <p class="text-gray-400">
        All uploaded surf analyses
    </p>
</div>

<div id="dashboard-container">
    {% include "dashboard_partial.html" %}
</div>

<script>
setInterval(() => {
    fetch("/dashboard-data")
        .then(res => res.text())
        .then(html => {
            document.getElementById("dashboard-container").innerHTML = html;
        });
}, 5000);
</script>

{% endblock %}
