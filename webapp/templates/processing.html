{% extends "base.html" %}

{% block title %}Processing{% endblock %}

{% block content %}

<div class="text-center mb-12">
    <h2 class="text-3xl font-semibold mb-4">Analyzing Your Ride</h2>
    <p class="text-gray-400">AI engine processing your wave data</p>
</div>

<div class="glass border border-gray-800 p-10 rounded-2xl">

    <p class="mb-6 text-gray-400 text-sm">Job ID: {{ job_id }}</p>
    <p id="status" class="mb-6 text-lg">Initializing analysis...</p>

    <div class="w-full bg-gray-800 rounded-full h-3 overflow-hidden">
        <div id="bar" class="h-3 bg-gradient-to-r from-accent to-accent2 w-1/4 transition-all duration-700"></div>
    </div>

</div>

<script>
let progress = 25;

async function poll() {
    try {
        const res = await fetch("/api/jobs/{{ job_id }}");
        const data = await res.json();

        if (!data.ok) return;

        const status = data.job.status;
        document.getElementById("status").innerText = "Status: " + status;

        if (progress < 90) {
            progress += 5;
            document.getElementById("bar").style.width = progress + "%";
        }

        if (status === "done") {
            document.getElementById("bar").style.width = "100%";
            window.location.href = "/result/{{ job_id }}";
            return;
        }

        setTimeout(poll, 2000);
    } catch {
        setTimeout(poll, 3000);
    }
}

poll();
</script>

{% endblock %}
