<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}SurfAnalyze{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deep: "#0B0F17",
                        accent: "#00E5FF",
                        accent2: "#3B82F6"
                    }
                }
            }
        }
    </script>

    <style>
        /* 🌅 Ocean Dawn Background */
        body {
            background:
                radial-gradient(circle at 50% 95%, rgba(255,140,0,0.08), transparent 45%),
                radial-gradient(circle at 20% 30%, rgba(0,229,255,0.08), transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(59,130,246,0.08), transparent 40%),
                linear-gradient(180deg, #0B0F17 0%, #111827 60%, #1f2937 100%);
            overflow-x: hidden;
            position: relative;
        }

        /* 🌊 Moving wave layer */
        body::before {
            content: "";
            position: fixed;
            bottom: -140px;
            left: 0;
            width: 200%;
            height: 250px;
            background: radial-gradient(circle at 50% 50%, rgba(0,229,255,0.18), transparent 70%);
            animation: waveMove 25s linear infinite;
            opacity: 0.25;
            pointer-events: none;
        }

        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Glass */
        .glass {
            backdrop-filter: blur(16px);
            background: rgba(255,255,255,0.04);
        }

        /* Glow button */
        .glow-btn {
            background: linear-gradient(135deg, #00E5FF, #3B82F6);
            box-shadow: 0 0 25px rgba(0,229,255,0.3);
            transition: all 0.3s ease;
        }

        .glow-btn:hover {
            box-shadow: 0 0 45px rgba(0,229,255,0.6);
            transform: translateY(-2px);
        }

        /* Logo */
        .wave-logo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #00E5FF, #1E3A8A);
            box-shadow: 0 0 20px rgba(0,229,255,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(0,229,255,0.4); }
            50% { box-shadow: 0 0 35px rgba(0,229,255,0.8); }
            100% { box-shadow: 0 0 15px rgba(0,229,255,0.4); }
        }

        /* Card hover */
        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-6px);
            box-shadow: 0 0 40px rgba(0,229,255,0.15);
        }
    </style>
</head>

<body class="text-gray-200 min-h-screen">

<nav class="border-b border-gray-800 bg-black/30 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">

        <a href="/" class="flex items-center gap-3 group">
            <div class="wave-logo group-hover:scale-110 transition">
                🌊
            </div>
            <div class="text-xl font-semibold tracking-wide text-accent group-hover:text-white transition">
                SurfAnalyze
            </div>
        </a>

        <div class="space-x-6 text-sm text-gray-400">
            <a href="/" class="hover:text-white">Upload</a>
            <a href="/dashboard" class="hover:text-white">Your Videos</a>
        </div>
    </div>
</nav>

<main class="max-w-4xl mx-auto px-6 py-16 relative z-10">
    {% block content %}{% endblock %}
</main>

</body>
</html>
