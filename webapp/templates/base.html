<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SurfAnalyze{% endblock %}</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deep: "#0B0F17",
                        accent: "#00E5FF",
                        accent2: "#3B82F6"
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background:
                radial-gradient(circle at 50% 95%, rgba(255,140,0,0.08), transparent 45%),
                radial-gradient(circle at 20% 30%, rgba(0,229,255,0.08), transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(59,130,246,0.08), transparent 40%),
                linear-gradient(180deg, #0B0F17 0%, #111827 60%, #1f2937 100%);
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            bottom: -140px;
            left: 0;
            width: 200%;
            height: 250px;
            background: radial-gradient(circle at 50% 50%, rgba(0,229,255,0.18), transparent 70%);
            animation: waveMove 25s linear infinite;
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes waveMove {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .glass {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(255,255,255,0.04);
        }

        .glow-btn {
            background: linear-gradient(135deg, #00E5FF, #3B82F6);
            box-shadow: 0 0 25px rgba(0,229,255,0.3);
            transition: all 0.3s ease;
        }

        .glow-btn:hover {
            box-shadow: 0 0 45px rgba(0,229,255,0.6);
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="text-gray-200 min-h-screen">

<nav class="border-b border-gray-800 bg-black/30 backdrop-blur-md relative z-20">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="/" class="text-xl font-semibold text-accent">
            SurfAnalyze
        </a>

        <div class="space-x-6 text-sm text-gray-400">
            <a href="/" class="hover:text-white">
                Upload
            </a>
            <a href="/dashboard" class="hover:text-white">
                Your Videos
            </a>
        </div>
    </div>
</nav>

<main class="max-w-4xl mx-auto px-6 py-16 relative z-10">
    {% block content %}{% endblock %}
</main>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;

            tg.ready();
            tg.expand();

            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;

                fetch("/telegram-auth", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        telegram_id: user.id,
                        username: user.username || null,
                        first_name: user.first_name || null,
                        last_name: user.last_name || null
                    })
                }).catch(function (error) {
                    console.error("Telegram auth failed:", error);
                });
            }
        }
    });
</script>

{% block scripts %}{% endblock %}

</body>
</html>
