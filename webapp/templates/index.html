{% extends "base.html" %}
{% block content %}

<!-- Neon Wave Accent -->
<div class="flex justify-center mb-14">
    <svg width="220" height="120" viewBox="0 0 220 120">
        <defs>
            <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#00E5FF"/>
                <stop offset="100%" stop-color="#3B82F6"/>
            </linearGradient>
        </defs>

        <path d="M10 80 Q 90 10 160 60 T 210 45"
              stroke="url(#waveGrad)"
              stroke-width="4"
              fill="none"
              stroke-linecap="round">
            <animate attributeName="stroke-dasharray"
                     values="0,400;200,200;0,400"
                     dur="6s"
                     repeatCount="indefinite"/>
        </path>
    </svg>
</div>

<!-- Hero Text -->
<div class="text-center mb-16">
    <h1 class="text-5xl font-bold mb-6 bg-gradient-to-r from-accent to-accent2 bg-clip-text text-transparent">
        Improve Your Surf Performance
    </h1>
    <p class="text-gray-400 text-lg">
        Upload your wave. Get precision AI feedback.
    </p>
</div>

<!-- Upload Form -->
<form action="/upload" method="post" enctype="multipart/form-data" id="uploadForm">

    <div id="dropZone"
         class="glass border-2 border-dashed border-gray-700
                p-16 rounded-3xl text-center cursor-pointer
                transition-all duration-300
                hover:border-accent hover:shadow-[0_0_40px_rgba(0,229,255,0.25)]">

        <p class="text-gray-300 text-lg mb-4">
            Drag & Drop your surf video
        </p>

        <p class="text-sm text-gray-500 mb-6">
            or click to select a file
        </p>

        <p id="fileName" class="text-sm text-accent hidden"></p>

        <input type="file" name="file" id="fileInput" required class="hidden">
    </div>

    <div class="text-center mt-10">
        <button type="submit"
                class="glow-btn px-10 py-4 rounded-xl font-semibold text-black">
            Analyze My Wave
        </button>
    </div>

</form>

<script>
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const fileName = document.getElementById("fileName");

dropZone.addEventListener("click", () => fileInput.click());

dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.classList.add("border-accent");
});

dropZone.addEventListener("dragleave", () => {
    dropZone.classList.remove("border-accent");
});

dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    fileInput.files = e.dataTransfer.files;
    dropZone.classList.remove("border-accent");
    showFileName();
});

fileInput.addEventListener("change", showFileName);

function showFileName() {
    if (fileInput.files.length > 0) {
        fileName.textContent = "Selected: " + fileInput.files[0].name;
        fileName.classList.remove("hidden");
    }
}
</script>

{% endblock %}
