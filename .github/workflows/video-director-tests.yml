name: Video Director checks

on:
  push:
    branches:
      - codex/video-director-coach-editor
      - codex/ffmpeg-video-rendering
  pull_request:
    paths:
      - "services/video_director.py"
      - "services/video_renderer.py"
      - "webapp/**"
      - "jobs/**"
      - "tests/**"
      - ".github/workflows/video-director-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      DATABASE_PATH: /tmp/surfanalyze-ci.sqlite3
      API_TOKEN: dummy_token_for_tests
      SESSION_SECRET: test-only-signing-key-with-at-least-32-characters
      SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install video tools and Unicode font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Compile Python modules
        run: python -m compileall -q services jobs webapp tests
      - name: Bootstrap isolated test database
        run: python -c "from config import settings; from storage.database import Database; Database(settings.DATABASE_PATH)"
      - name: Run regression suite including real FFmpeg exports
        run: python -m pytest -q
